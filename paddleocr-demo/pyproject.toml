[project]
name = "paddleocr-demo"
version = "0.1.0"
description = "Paddle OCR Demo"
readme = "README.md"
requires-python = ">=3.12"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

dependencies = [
    "fastapi>=0.136.3",
    "paddleocr==3.0.3",
    "paddlex[ie,multimodal,ocr]==3.0.3",
    "paddlepaddle==3.0.0",
    "python-multipart>=0.0.32",
    "setuptools>=82.0.1",
    "uvicorn[standard]>=0.49.0",
    "langchain==0.3.30",
]
